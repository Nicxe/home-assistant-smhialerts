name: Validate

on:
  push:
    branches: [dev, beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Set up Node.js for card regressions
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check Python style
        run: |
          ruff check custom_components/smhi_alerts conftest.py
          ruff format --check custom_components/smhi_alerts conftest.py
      - name: Test integration and card
        run: python -m pytest -q

  validate:
    uses: nicxe/.github/.github/workflows/reusable-validate-integration.yml@main
    with:
      hacs_category: "integration"
      run_hassfest: true
    secrets: inherit

  check_card_syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check card syntax
        run: node --input-type=module --check < custom_components/smhi_alerts/www/smhi-alert-card.js
